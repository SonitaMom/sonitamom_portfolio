<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sonitamomportfolio.vercel.app/" />
    <meta property="og:title" content="Mom Sonita - Portfolio" />
    <meta
      property="og:description"
      content="Welcome to Mom Sonita's personal portfolio. "
    />
    <meta
      property="og:image"
      content="https://sonitamomportfolio.vercel.app/src/assets/portfolio_preview.webp"
    />
    <link rel="icon" type="image/png" href="./src/assets/portfolio.webp" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Arbutus+Slab&family=Archivo+Black&family=Aref+Ruqaa:wght@400;700&family=Just+Another+Hand&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./src/CSS/style.css" />

    <title>Mom Sonita - Portfolio</title>
  </head>
  <body>
    <header class="main-header">
      <nav class="navbar navbar-expand-lg top-0 start-0 w-100 position-fixed">
        <div
          class="container-fluid navbar-container d-flex align-items-center justify-content-between navbar-container"
        >
          <a href="#" class="navbar-brand header-title">Sonita's Portfolio</a>
          <button
            class="navbar-toggler"
            type="button"
            aria-controls="navbarContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
            id="navToggle"
          >
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </button>

          <div class="nav-overlay" id="navOverlay"></div>
          <div class="navbar-collapse" id="navbarContent">
            <ul
              class="navbar-nav ms-auto gap-4 align-items-center"
              id="navLinks"
            >
              <li class="nav-item">
                <a href="#" class="nav-link active" aria-current="page">Home</a>
              </li>
              <li class="nav-item">
                <a href="#about" class="nav-link">About me</a>
              </li>
              <li class="nav-item">
                <a href="#projects" class="nav-link">Projects</a>
              </li>
              <li class="nav-item">
                <a href="#contact" class="nav-link">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <section id="hero"></section>
    <section id="about"></section>
    <section id="projects"></section>
    <section id="contact"></section>
    <footer id="footer"></footer>

    <div
      class="project-modal"
      id="projectModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="projectModalTitle"
    >
      <div class="project-modal-card">
        <div class="project-modal-header">
          <h2 id="projectModalTitle">Project</h2>

          <button
            type="button"
            class="project-modal-close"
            onclick="closeProjectModal()"
            aria-label="Close"
          >
            &times;
          </button>
        </div>

        <!-- BODY -->
        <div class="project-modal-body">
          <!-- LARGE IMAGE -->
          <div class="project-modal-hero">
            <img id="projectModalHero" src="" alt="" />
          </div>

          <!-- THUMBNAILS -->
          <div
            class="project-modal-thumbnails"
            id="projectModalThumbnails"
          ></div>
        </div>
      </div>
    </div>
    <script src="./src/js/home.js"></script>
    <script src="./src/js/skillLoop.js"></script>
    <script src="./src/js/navbar.js"></script>
    <script src="./src/js/contact.js"></script>
    <script src="./src/js/project.js" defer></script>
  </body>
</html>
